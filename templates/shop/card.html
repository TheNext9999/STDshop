<link rel="stylesheet" href="/static/css/card.css" />

<section class="suggestions">
  <!-- Product Card -->
  <article class="product-card">
    <div class="product-card__image-wrap">
      <img class="product-card__image" src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600&q=80" alt="Laptop Dell Inspiron 15 3000" />
      <span class="badge badge--discount">-38%</span>
      <span class="badge badge--bestseller">🔥 Bán chạy</span>
    </div>

    <div class="product-card__body">
      <h3 class="product-card__title">Laptop Dell Inspiron 15 3000 – Core i5, RAM 8GB, SSD...</h3>

      <div class="product-card__meta">
        <span class="product-card__stars">★★★★<span class="star-half">★</span></span>
        <span class="product-card__rating">4.8</span>
        <span class="product-card__divider">|</span>
        <span class="product-card__sold">Đã bán 1.2k</span>
      </div>

      <div class="product-card__price">
        <span class="product-card__price-current">8.990.000đ</span>
        <span class="product-card__price-old">14.500.000đ</span>
      </div>
    </div>
  </article>
</section>
