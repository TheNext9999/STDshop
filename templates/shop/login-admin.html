<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTAFood Admin Portal • Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/login-admin.css">
</head>
<body>

<div class="admin-card">
    <!-- Header bảo mật -->
    <div class="admin-header">
        <h1>DTAFood Admin Portal</h1>
        <p>Quản trị hệ thống • Chỉ dành cho Quản lý</p>
        <div class="badge">🔒 Only Authorized Admins</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchTab(0)">Đăng nhập</div>
        <div class="tab" id="tabRegister" onclick="switchTab(1)">Đăng ký Admin</div>
    </div>

    <div class="form-area">

        <!-- ==================== TAB ĐĂNG NHẬP ==================== -->
        <div id="loginForm">
            <h3 style="margin-bottom:20px;">Đăng nhập tài khoản Admin</h3>
            
            <input type="text" placeholder="Tên đăng nhập (Admin ID)" id="username">
            <input type="password" placeholder="Mật khẩu" id="password">
            
            <select id="otpType">
                <option value="email">Gửi OTP qua Email</option>
                <option value="phone">Gửi OTP qua Số điện thoại</option>
            </select>

            <button class="btn-admin" onclick="sendAdminOTP()">Gửi mã OTP</button>

            <div id="adminOTPSection" style="display:none; margin-top:20px;">
                <label>Nhập mã OTP (6 số)</label>
                <input type="text" maxlength="6" placeholder="123456" style="text-align:center; font-size:1.5rem; letter-spacing:8px;" id="otpInput">
                <button class="btn-admin" onclick="verifyAdminOTP()">Xác nhận OTP & Đăng nhập</button>
            </div>

            <div class="footer-link">
                Quên mật khẩu? <a href="#" style="color:var(--primary);">Khôi phục ngay</a>
            </div>
        </div>

        <!-- ==================== TAB ĐĂNG KÝ ==================== -->
        <div id="registerForm" style="display:none;">
            <h3 style="margin-bottom:20px;">Đăng ký tài khoản Admin mới</h3>
            
            <input type="text" placeholder="Họ và tên đầy đủ">
            <input type="email" placeholder="Email quản lý">
            <input type="text" placeholder="Số điện thoại">
            <input type="password" placeholder="Mật khẩu mạnh (ít nhất 8 ký tự)">
            <input type="text" placeholder="Mã mời Admin (bắt buộc)" style="border-color:#e11d48;">
            
            <button class="btn-admin" style="background:#e11d48;" onclick="registerAdmin()">
                Yêu cầu tạo tài khoản Admin
            </button>
            
            <p style="text-align:center; margin-top:15px; font-size:0.9rem; color:#64748b;">
                Mã mời chỉ được cấp bởi Super Admin
            </p>
        </div>

    </div>

    <div style="text-align:center; padding:20px; background:#f8fafc; font-size:0.9rem;">
        © 2026 DTAFood • Admin System • All rights reserved
    </div>
</div>



    <script src="/js/login-admin.js"></script>
</body>
</html>
